<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator Test</title>
</head>
<body>
    <h1>Calculator Function Test</h1>
    <div id="results"></div>
    <script>
        function calculate(a, op, b) {
            const num1 = parseFloat(a);
            const num2 = parseFloat(b);
            
            switch(op) {
                case '+':
                    return (num1 + num2).toString();
                case '-':
                    return (num1 - num2).toString();
                case '*':
                    return (num1 * num2).toString();
                case '/':
                    return num2 !== 0 ? (num1 / num2).toString() : 'Error';
                default:
                    return b;
            }
        }

        const tests = [
            {a: '5', op: '+', b: '3', expected: '8'},
            {a: '10', op: '-', b: '4', expected: '6'},
            {a: '6', op: '*', b: '7', expected: '42'},
            {a: '20', op: '/', b: '5', expected: '4'},
            {a: '10', op: '/', b: '0', expected: 'Error'},
            {a: '5.5', op: '+', b: '2.5', expected: '8'},
        ];

        let results = '<h2>Test Results:</h2><ul>';
        let allPassed = true;

        tests.forEach((test, i) => {
            const result = calculate(test.a, test.op, test.b);
            const passed = result === test.expected;
            allPassed = allPassed && passed;
            results += `<li>Test ${i + 1}: ${test.a} ${test.op} ${test.b} = ${result} (Expected: ${test.expected}) - ${passed ? '✓ PASS' : '✗ FAIL'}</li>`;
        });

        results += '</ul>';
        results += `<h3>${allPassed ? 'All tests passed! ✓' : 'Some tests failed ✗'}</h3>`;
        
        document.getElementById('results').innerHTML = results;
        console.log('All tests passed:', allPassed);
    </script>
</body>
</html>
